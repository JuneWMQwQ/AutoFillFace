name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean AutoFillFace.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AutoFillFace -DestinationPath dist/AutoFillFace.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFillFace-windows
          path: dist/AutoFillFace.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoFillFace.zip
          name: ${{ github.ref_name }}
